name: Build macOS DMG

on:
  push:
    branches:
      - main
      - oha-develop
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        required: true
        default: experimental
        type: choice
        options:
          - stable
          - alpha
          - experimental
      public_demo:
        description: Public demo evidence scope
        required: true
        default: safe
        type: choice
        options:
          - safe
          - full
      publish_release:
        description: Publish GitHub Release assets (branch must match channel)
        required: true
        default: false
        type: boolean

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS DMG
    runs-on: macos-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub Release publication target
        if: github.event_name == 'push' || inputs.publish_release == true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="experimental"
          fi
          case "${CHANNEL}" in
            stable) EXPECTED_BRANCH="main" ;;
            alpha) EXPECTED_BRANCH="alpha" ;;
            experimental) EXPECTED_BRANCH="oha-develop" ;;
            *) echo "Unsupported release channel: ${CHANNEL}" >&2; exit 1 ;;
          esac
          if [[ "${GITHUB_REF_NAME}" != "${EXPECTED_BRANCH}" ]]; then
            echo "Refusing to publish ${CHANNEL} from ${GITHUB_REF_NAME}; expected ${EXPECTED_BRANCH}." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate app version sync
        run: python scripts/app_version.py check

      - name: Verify release-facing product identity and security guards
        run: python scripts/verify_release_artifacts.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend

      - name: Prepare embedded Cua Driver
        run: python scripts/prepare_cua_driver.py --clean

      - name: Test passive background-control readiness states
        run: npm --prefix apps/frontend run test:background-control-readiness

      - name: Test Electron-owned Cua MCP bridge
        run: npm --prefix apps/frontend run test:cua-mcp-bridge

      - name: Run public release preflight gate
        env:
          PUBLIC_DEMO_MODE: ${{ inputs.public_demo || 'safe' }}
          OHA_YACHIYO_SMOKE_BASE_URL: ${{ secrets.OHA_YACHIYO_SMOKE_BASE_URL }}
          OHA_YACHIYO_SMOKE_MODEL: ${{ secrets.OHA_YACHIYO_SMOKE_MODEL }}
          OHA_YACHIYO_SMOKE_API_KEY: ${{ secrets.OHA_YACHIYO_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          public_demo_args=()
          if [[ "${PUBLIC_DEMO_MODE}" == "full" ]]; then
            public_demo_args+=(--include-ui)
          fi
          python scripts/run_public_release_gate.py \
            --tmp-dir release/public-release-gate \
            --output-json release/public-release-gate.json \
            --output-markdown release/public-release-gate.md \
            "${public_demo_args[@]}"

      - name: Run smoke tests
