name: Build macOS DMG

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        required: true
        default: experimental
        type: choice
        options:
          - stable
          - experimental

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS DMG
    runs-on: macos-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate app version sync
        run: python scripts/app_version.py check

      - name: Verify release-facing product identity and security guards
        run: python scripts/verify_release_artifacts.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend

      - name: Run smoke tests
        run: |
          python -m pytest \
            tests/test_protocol.py \
            tests/test_state.py \
            tests/test_task_runner.py::test_task_runner_main_chat_native_tool_approval_roundtrip \
            tests/test_task_runner.py::test_task_runner_main_chat_approval_timeout_clears_chat_and_activity_projection \
            tests/test_task_runner.py::test_task_runner_main_chat_image_attachment_reaches_native_model \
            tests/test_task_runner.py::test_task_runner_main_chat_auto_delegation_uses_native_runtime \
            tests/test_task_runner.py::test_task_runner_group_dispatch_summary_uses_native_runtime \
            tests/test_task_runner.py::test_task_runner_direct_group_agent_summary_uses_native_runtime \
            tests/test_task_runner.py::test_task_runner_direct_group_agent_rejected_summary_uses_native_runtime \
            tests/test_task_runner.py::test_task_runner_proactive_screenshot_task_uses_native_runtime \
            tests/test_agent_runtime.py::test_main_chat_approval_timeout_records_replayable_fact_and_is_idempotent \
            tests/test_agent_runtime.py::test_main_chat_records_failed_run_event_when_approved_tool_fails \
            tests/test_agent_runtime.py::test_main_chat_repeated_approval_does_not_execute_tool_twice \
            tests/test_agent_runtime.py::test_main_chat_approval_uses_resume_coordinator_claim_boundary \
            tests/test_agent_runtime.py::test_tool_approval_transitions_use_shared_context_boundary \
            tests/test_agent_runtime.py::test_main_chat_durable_approval_claim_blocks_duplicate_execution \
            tests/test_agent_runtime.py::test_approval_resume_coordinator_claims_and_projects_approved_tool_once \
            tests/test_agent_runtime.py::test_agent_run_approval_uses_resume_coordinator_claim_boundary \
            tests/test_agent_runtime.py::test_approval_resume_coordinator_executes_approved_tool_and_remaining_requests \
            tests/test_agent_runtime.py::test_approval_resume_coordinator_stops_on_fatal_tool_failure \
            tests/test_agent_runtime.py::test_approval_resume_coordinator_continues_custom_api_agent_after_approved_tool \
            tests/test_agent_runtime.py::test_run_approval_routes_return_404_and_are_idempotent \
            tests/test_agent_runtime.py::test_run_approval_reject_route_is_idempotent \
            tests/test_agent_runtime.py::test_concurrent_cancel_run_is_idempotent \
            tests/test_bridge_server.py::test_run_cancel_route_handler_is_idempotent \
            tests/test_bridge_server.py::test_chat_cancel_bridge_route_cancels_native_run_and_ignores_late_output \
            tests/test_executor.py::TestNativeAgentExecutor::test_run_uses_native_run_and_returns_task_result \
            tests/test_executor.py::TestNativeAgentExecutor::test_run_passes_recent_chat_history_and_excludes_current_task \
            tests/test_executor.py::TestNativeAgentExecutor::test_run_limits_chat_history_by_context_chars \
            tests/test_executor.py::TestNativeAgentExecutor::test_run_passes_image_attachments_as_limited_data_urls \
            tests/test_agent_runtime.py::test_main_chat_run_links_task_and_records_replayable_events \
            tests/test_agent_runtime.py::test_task_run_link_repository_tracks_run_projection \
            tests/test_agent_runtime.py::test_run_event_repository_allocates_sequences_under_concurrent_writers \
            tests/test_agent_runtime.py::test_runtime_sqlite_enables_required_database_guards \
            tests/test_agent_runtime.py::test_runtime_shutdown_cancels_active_runs_rejects_new_runs_and_records_fact \
            tests/test_agent_runtime.py::test_runtime_shutdown_close_db_closes_runtime_resources \
            tests/test_agent_runtime.py::test_agent_run_validates_write_patch_workspace_boundary_before_approval \
            tests/test_agent_runtime.py::test_tool_broker_rejects_symlink_workspace_escape \
            tests/test_agent_runtime.py::test_tool_descriptor_schema_and_validation_share_patch_contract \
            tests/test_agent_runtime.py::test_workspace_write_patch_applies_single_file_unified_diff_with_hash \
            tests/test_agent_runtime.py::test_workspace_write_patch_rejects_hash_or_context_mismatch_without_writing \
            tests/test_agent_runtime.py::test_workspace_write_patch_rejects_multifile_or_binary_patch \
            tests/test_agent_runtime.py::test_terminal_run_uses_workspace_argv_and_scrubbed_environment \
            tests/test_agent_runtime.py::test_terminal_run_startup_failure_returns_structured_sanitized_error \
            tests/test_agent_runtime.py::test_terminal_run_truncates_and_sanitizes_outputs \
            tests/test_agent_runtime.py::test_agent_run_redacts_approved_terminal_failure_output_from_projection_and_storage \
            tests/test_agent_runtime.py::test_terminal_run_timeout_kills_process_group \
            tests/test_agent_runtime.py::test_main_chat_model_rejects_non_stream_reasoning_only_output \
            tests/test_agent_runtime.py::test_main_chat_model_loop_rejects_non_stream_reasoning_only_output \
            tests/test_agent_runtime.py::test_main_chat_provider_exception_is_redacted_from_run_events_and_storage \
            tests/test_agent_runtime.py::test_main_chat_tool_exception_is_redacted_from_tool_messages_events_and_storage \
            tests/test_agent_runtime.py::test_main_chat_model_loop_executes_sse_delta_tool_call_object_arguments \
            tests/test_streaming_provider_smoke.py \
            tests/test_legacy_kernel_removal.py \
            tests/test_runtime_injection_boundary.py \
            tests/test_runtime.py \
            tests/test_desktop_backend_app.py \
            tests/test_desktop_launcher.py \
            tests/test_shell_app_entrypoint.py \
            tests/test_main_api_modes.py \
            tests/test_model_capabilities.py \
            tests/test_model_profiles.py \
            tests/test_provider_catalog_sync.py \
            tests/test_build_backend.py \
            tests/test_build_metadata.py \
            tests/test_credential_store.py \
            tests/test_secret_redaction_verifier.py \
            tests/test_security_logging.py \
            tests/test_screenshot.py \
            tests/test_proactive.py \
            tests/test_launcher_notifications.py \
            tests/test_chat_session.py \
            tests/test_chat_store.py \
            tests/test_chat_bridge.py \
            tests/test_chat_api.py \
            tests/test_activity_store.py \
            tests/test_ui_bridge_routes.py \
            tests/test_frontend_feature_preservation.py \
            tests/test_ui_mature_flow_contract.py \
            tests/test_bridge_server.py::test_bridge_http_middleware_enforces_host_origin_and_session_token \
            tests/test_bridge_server.py::test_bridge_start_and_restart_reject_non_loopback_host_before_binding \
            tests/test_bridge_server.py::test_all_registered_mutating_routes_require_bridge_token \
            tests/test_bridge_server.py::test_run_events_http_route_paginates_and_hides_non_user_events \
            tests/test_bridge_server.py::test_chat_message_image_attachment_http_roundtrip_maps_idempotency_and_file_response \
            tests/test_bridge_server.py::test_chat_image_bridge_route_reaches_native_run_events \
            tests/test_bridge_server.py::test_chat_approval_bridge_route_projects_failed_approved_tool \
            tests/test_bridge_server.py::test_agent_run_http_routes_roundtrip_approval_detail_and_replay \
            tests/test_bridge_server.py::test_agent_run_http_routes_roundtrip_reject_detail_and_replay \
            tests/test_bridge_server.py::test_agent_run_http_routes_roundtrip_cancel_detail_and_replay \
            tests/test_agent_runtime.py::test_workflow_routes_save_and_run_latest_canvas_with_step_approval_and_artifact \
            tests/test_agent_runtime.py::test_workflow_approval_transitions_use_shared_context_boundary \
            tests/test_bridge_server.py::test_workflow_approval_node_http_roundtrip_approve_detail_and_replay \
            tests/test_bridge_server.py::test_workflow_approval_node_http_roundtrip_reject_detail_and_replay \
            tests/test_bridge_server.py::test_workflow_approval_node_http_roundtrip_cancel_detail_group_and_replay \
            tests/test_bridge_server.py::test_workflow_run_http_routes_roundtrip_child_approval_detail_and_replay \
            tests/test_bridge_server.py::test_workflow_run_http_routes_roundtrip_child_reject_detail_and_replay \
            tests/test_bridge_server.py::test_workflow_run_http_routes_roundtrip_child_cancel_detail_and_replay \
            tests/test_bridge_server.py::test_workflow_rerun_http_roundtrip_detail_artifact_and_replay \
            tests/test_bridge_server.py::test_chat_group_dispatch_bridge_route_runs_native_summary \
            tests/test_bridge_server.py::test_chat_delegated_summary_bridge_route_runs_native_followup \
            tests/test_tts.py \
            tests/test_display_modes.py \
            tests/test_effect_policy.py \
            tests/test_mode_settings.py

      - name: Run opt-in real provider streaming smoke
        shell: bash
        env:
          OHA_YACHIYO_SMOKE_BASE_URL: ${{ secrets.OHA_YACHIYO_SMOKE_BASE_URL }}
          OHA_YACHIYO_SMOKE_MODEL: ${{ secrets.OHA_YACHIYO_SMOKE_MODEL }}
          OHA_YACHIYO_SMOKE_API_KEY: ${{ secrets.OHA_YACHIYO_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OHA_YACHIYO_SMOKE_BASE_URL}" || -z "${OHA_YACHIYO_SMOKE_MODEL}" || -z "${OHA_YACHIYO_SMOKE_API_KEY}" ]]; then
            echo "Skipping opt-in real provider streaming smoke; OHA_YACHIYO_SMOKE_* secrets are not fully configured."
            exit 0
          fi

          python scripts/smoke_openai_compatible_stream.py \
            --require-content \
            --expect-finish-reason stop

          python scripts/smoke_openai_compatible_stream.py \
            --tool-call \
            --require-tool-call \
            --expect-tool-name workspace_read \
            --expect-tool-argument-substring README.md \
            --expect-tool-argument-json-field path=README.md \
            --expect-finish-reason tool_calls

      - name: Build packaged backend
        run: python scripts/build_backend.py --clean

      - name: Import macOS self-signing certificate
        id: macos_signing
        shell: bash
        env:
          MACOS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CODESIGN_CERTIFICATE_BASE64}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "signing_mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "No macOS self-signing certificate configured; the DMG will be unsigned." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SIGNING_IDENTITY="${MACOS_CODESIGN_IDENTITY:-Oha-Yachiyo Self Signed}"
          CERT_PASSWORD="${MACOS_CODESIGN_CERTIFICATE_PASSWORD:-}"
          if [[ -z "${CERT_PASSWORD}" ]]; then
            echo "MACOS_CODESIGN_CERTIFICATE_PASSWORD is required when MACOS_CODESIGN_CERTIFICATE_BASE64 is configured." >&2
            echo "Set the password value from dist/signing/*.github-secrets.env, without the variable name." >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          KEYCHAIN_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.p12"
          CERT_PEM_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.pem"
          CERT_X509_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.crt"

          CLEAN_CERT_BASE64="$(printf '%s' "${MACOS_CODESIGN_CERTIFICATE_BASE64}" | tr -d '[:space:]')"
          if ! printf '%s' "${CLEAN_CERT_BASE64}" | base64 --decode > "${CERT_PATH}" 2>/dev/null; then
            printf '%s' "${CLEAN_CERT_BASE64}" | base64 -D > "${CERT_PATH}"
          fi
          if [[ ! -s "${CERT_PATH}" ]]; then
            echo "Decoded MACOS_CODESIGN_CERTIFICATE_BASE64 is empty." >&2
            exit 1
          fi
          if ! openssl pkcs12 -in "${CERT_PATH}" -info -noout -passin "pass:${CERT_PASSWORD}" >/dev/null 2>&1; then
            echo "Cannot read the macOS signing p12 with MACOS_CODESIGN_CERTIFICATE_PASSWORD." >&2
            echo "Check that MACOS_CODESIGN_CERTIFICATE_BASE64 and MACOS_CODESIGN_CERTIFICATE_PASSWORD come from the same generated dist/signing/*.github-secrets.env file." >&2
            echo "When adding GitHub Secrets, paste only the value after '='; do not include the KEY= prefix." >&2
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          if ! security import "${CERT_PATH}" \
              -k "${KEYCHAIN_PATH}" \
              -P "${CERT_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security; then
            echo "macOS Keychain could not import the signing p12." >&2
            echo "If OpenSSL validation passed but security import failed, regenerate the certificate with the current scripts/create_macos_self_signed_cert.sh and update all MACOS_CODESIGN_* Secrets from the new *.github-secrets.env file." >&2
            exit 1
          fi
          openssl pkcs12 \
            -in "${CERT_PATH}" \
            -clcerts \
            -nokeys \
            -out "${CERT_PEM_PATH}" \
            -passin "pass:${CERT_PASSWORD}"
          openssl x509 -in "${CERT_PEM_PATH}" -out "${CERT_X509_PATH}"
          sudo security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "${CERT_X509_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}" >/dev/null
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}")"
          echo "${IDENTITY_OUTPUT}"
          if ! grep -Eq '^[[:space:]]*[0-9]+\) [A-F0-9]{40} ' <<< "${IDENTITY_OUTPUT}"; then
            echo "No valid macOS code signing identity found after importing the p12." >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "signing_mode=self-signed-app-unsigned-dmg" >> "$GITHUB_OUTPUT"
          echo "identity=${SIGNING_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "keychain=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "Imported self-signing certificate identity: ${SIGNING_IDENTITY}" >> "$GITHUB_STEP_SUMMARY"

      - name: Write app build metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python scripts/app_version.py current)"
          RELEASE_VERSION="${VERSION}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="experimental"
          fi

          if [[ "${CHANNEL}" == "stable" ]]; then
            LATEST_BRANCH="main"
          else
            LATEST_BRANCH="develop"
          fi

          mkdir -p apps/frontend/public
          cat > apps/frontend/public/oha-yachiyo-build.json <<EOF
          {
            "name": "Oha-Yachiyo",
            "channel": "${CHANNEL}",
            "branch": "${LATEST_BRANCH}",
            "source_branch": "${GITHUB_REF_NAME}",
            "version": "${RELEASE_VERSION}",
            "base_version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "short_commit": "${SHORT_SHA}",
            "build_number": ${BUILD_NUMBER},
            "run_number": ${GITHUB_RUN_NUMBER},
            "repository": "${GITHUB_REPOSITORY}",
            "latest_json_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_BRANCH}-latest/Oha-Yachiyo-${LATEST_BRANCH}-latest.json",
            "built_at": "${STAMP}"
          }
          EOF

      - name: Build Electron DMG
        shell: bash
        env:
          MACOS_SIGNING_ENABLED: ${{ steps.macos_signing.outputs.enabled }}
          MACOS_CODESIGN_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
        run: |
          set -euo pipefail
          if [[ "${MACOS_SIGNING_ENABLED}" == "true" ]]; then
            scripts/build_macos_self_signed_dmg.sh "${MACOS_CODESIGN_IDENTITY}"
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false npm --prefix apps/frontend run dist:mac
          fi

      - name: Verify packaged app resources
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d dist/electron ]]; then
            echo "No Electron package output found under dist/electron" >&2
            exit 1
          fi

          package_scan_paths=(dist/backend)
          app_resource_dirs=()
          while IFS= read -r -d '' resources_dir; do
            app_resource_dirs+=("${resources_dir}")
          done < <(find dist/electron -path '*/Oha-Yachiyo.app/Contents/Resources' -type d -print0)

          if [[ "${#app_resource_dirs[@]}" -eq 0 ]]; then
            echo "No packaged app resources found under dist/electron" >&2
            exit 1
          fi

          package_scan_paths+=("${app_resource_dirs[@]}")
          python scripts/verify_release_artifacts.py --allow-binary "${package_scan_paths[@]}"

      - name: Prepare release metadata
        id: meta
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
        run: |
          set -euo pipefail
          SIGNING_MODE="${MACOS_SIGNING_MODE:-unsigned}"
          VERSION="$(python scripts/app_version.py current)"
          RELEASE_VERSION="${VERSION}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BUILD_LABEL="build.${BUILD_NUMBER}"
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="experimental"
          fi

          if [[ "${CHANNEL}" == "stable" ]]; then
            CHANNEL_LABEL="正式版"
            PRERELEASE="false"
            LATEST_BRANCH="main"
          else
            CHANNEL_LABEL="实验版"
            PRERELEASE="true"
            LATEST_BRANCH="develop"
          fi

          TAG="${CHANNEL}-v${RELEASE_VERSION}-${BUILD_LABEL}-${SHORT_SHA}"
          TITLE="Oha-Yachiyo ${CHANNEL_LABEL} v${RELEASE_VERSION} #${BUILD_NUMBER} (${SHORT_SHA})"
          LATEST_TAG="${LATEST_BRANCH}-latest"
          LATEST_TITLE="Oha-Yachiyo ${CHANNEL_LABEL} latest"
          VERSIONED_DMG="Oha-Yachiyo-${CHANNEL}-v${RELEASE_VERSION}-${BUILD_LABEL}-${SHORT_SHA}.dmg"
          LATEST_DMG="Oha-Yachiyo-${LATEST_BRANCH}-latest.dmg"
          LATEST_JSON="Oha-Yachiyo-${LATEST_BRANCH}-latest.json"

          mkdir -p release
          shopt -s nullglob
          dmg_files=(dist/electron/*.dmg)
          if [[ "${#dmg_files[@]}" -eq 0 ]]; then
            echo "No DMG artifact found under dist/electron" >&2
            exit 1
          fi
          if [[ "${#dmg_files[@]}" -gt 1 ]]; then
            echo "Multiple DMG artifacts found; using ${dmg_files[0]}" >&2
          fi
          cp "${dmg_files[0]}" "release/${VERSIONED_DMG}"
          cp "${dmg_files[0]}" "release/${LATEST_DMG}"
          VERSIONED_SHA256="$(shasum -a 256 "release/${VERSIONED_DMG}" | tee "release/${VERSIONED_DMG}.sha256" | awk '{print $1}')"
          LATEST_SHA256="$(shasum -a 256 "release/${LATEST_DMG}" | tee "release/${LATEST_DMG}.sha256" | awk '{print $1}')"
          python scripts/generate_release_changelog.py \
            --channel "${CHANNEL}" \
            --tag "${TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --output-json release/changelog.json \
            --output-markdown release/changelog.md
          CHANGELOG_JSON="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.dumps(json.loads(Path("release/changelog.json").read_text()), ensure_ascii=False, indent=12))
          PY
          )"

          cat > "release/${LATEST_JSON}" <<EOF
          {
            "name": "Oha-Yachiyo",
            "channel": "${CHANNEL}",
            "branch": "${LATEST_BRANCH}",
            "source_branch": "${GITHUB_REF_NAME}",
            "version": "${RELEASE_VERSION}",
            "base_version": "${VERSION}",
            "commit": "${GITHUB_SHA}",
            "short_commit": "${SHORT_SHA}",
            "build_number": ${BUILD_NUMBER},
            "run_number": ${GITHUB_RUN_NUMBER},
            "run_id": "${GITHUB_RUN_ID}",
            "tag": "${TAG}",
            "signing": "${SIGNING_MODE}",
            "dmg_name": "${LATEST_DMG}",
            "sha256": "${LATEST_SHA256}",
            "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_DMG}",
            "latest_json_url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_JSON}",
            "published_at": "${STAMP}",
            "changelog": ${CHANGELOG_JSON}
          }
          EOF

          cat > release/notes.md <<EOF
          Oha-Yachiyo ${CHANNEL_LABEL}

          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Channel: ${CHANNEL}
          - Product version: ${VERSION}
          - Build: #${BUILD_NUMBER}
          - Signing: ${SIGNING_MODE}
          - Package: macOS DMG
          - Latest channel download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_DMG}

          $(cat release/changelog.md)

          当前免费分发链路只自签名 .app，未使用 Apple Developer ID 签名或 notarization，DMG 保持未签名，以避免 macOS 在挂载 DMG 前直接拒绝。首次启动应用时仍会显示未知开发者 / Gatekeeper 提示；请在 Finder 中按住 Control 点击应用并选择“打开”，或在系统设置的“隐私与安全性”中允许打开。

          GPT-SoVITS 语音资源包不随应用 DMG 发布；请在独立的“Yachiyo GPT-SoVITS Voice Assets”资源 release 中下载。

          首次启动后，主动桌面观察需要在 macOS 系统设置中允许 Oha-Yachiyo 使用屏幕录制权限。
          EOF

          cat > release/latest-notes.md <<EOF
          Oha-Yachiyo ${CHANNEL_LABEL} latest

          This rolling release always points to the latest ${LATEST_BRANCH} DMG.

          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Channel: ${CHANNEL}
          - Product version: ${VERSION}
          - Build: #${BUILD_NUMBER}
          - Signing: ${SIGNING_MODE}
          - DMG: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_DMG}

          $(cat release/changelog.md)

          当前免费分发链路只自签名 .app，未使用 Apple Developer ID 签名或 notarization，DMG 保持未签名；macOS 仍会在首次启动应用时显示未知开发者 / Gatekeeper 提示。
          EOF

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_title=${LATEST_TITLE}" >> "$GITHUB_OUTPUT"
          echo "versioned_dmg=${VERSIONED_DMG}" >> "$GITHUB_OUTPUT"
          echo "latest_dmg=${LATEST_DMG}" >> "$GITHUB_OUTPUT"
          echo "latest_json=${LATEST_JSON}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged release artifacts
        run: python scripts/verify_release_artifacts.py --allow-binary release

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: oha-yachiyo-${{ steps.meta.outputs.tag }}
          path: |
            release/*.dmg
            release/*.sha256
            release/*.json
            release/*.md

      - name: Create or update versioned GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          VERSIONED_DMG="${{ steps.meta.outputs.versioned_dmg }}"
          LATEST_DMG="${{ steps.meta.outputs.latest_dmg }}"
          LATEST_JSON="${{ steps.meta.outputs.latest_json }}"
          extra_flags=()
          release_assets=(
            "release/${VERSIONED_DMG}"
            "release/${VERSIONED_DMG}.sha256"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            extra_flags+=(--prerelease --latest=false)
          else
            extra_flags+=(--latest=true)
            release_assets+=(
              "release/${LATEST_DMG}"
              "release/${LATEST_DMG}.sha256"
              "release/${LATEST_JSON}"
            )
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "${release_assets[@]}" \
              --clobber
            gh release edit "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release/notes.md \
              "${extra_flags[@]}"
          else
            gh release create "${TAG}" \
              "${release_assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release/notes.md \
              "${extra_flags[@]}"
          fi

      - name: Create or update latest channel release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="${{ steps.meta.outputs.latest_tag }}"
          LATEST_TITLE="${{ steps.meta.outputs.latest_title }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          LATEST_DMG="${{ steps.meta.outputs.latest_dmg }}"
          LATEST_JSON="${{ steps.meta.outputs.latest_json }}"
          latest_flags=(--latest=false)
          latest_assets=(
            "release/${LATEST_DMG}"
            "release/${LATEST_DMG}.sha256"
            "release/${LATEST_JSON}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            latest_flags+=(--prerelease)
          fi

          if gh release view "${LATEST_TAG}" >/dev/null 2>&1; then
            gh release upload "${LATEST_TAG}" \
              "${latest_assets[@]}" \
              --clobber
            gh release edit "${LATEST_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${LATEST_TITLE}" \
              --notes-file release/latest-notes.md \
              "${latest_flags[@]}"
          else
            gh release create "${LATEST_TAG}" \
              "${latest_assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${LATEST_TITLE}" \
              --notes-file release/latest-notes.md \
              "${latest_flags[@]}"
          fi
