name: Build macOS DMG

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to build
        required: true
        default: experimental
        type: choice
        options:
          - stable
          - alpha
          - experimental

permissions:
  contents: write

jobs:
  package-macos:
    name: Package macOS DMG
    runs-on: macos-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate app version sync
        run: python scripts/app_version.py check

      - name: Verify release-facing product identity and security guards
        run: python scripts/verify_release_artifacts.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,packaging]"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend

      - name: Run smoke tests
        run: |
          python -m pytest \
            tests/test_protocol.py \
            tests/test_state.py \
            tests/test_task_runner.py::test_task_runner_main_chat_native_tool_approval_roundtrip \
