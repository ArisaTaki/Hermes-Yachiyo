      - name: Write app build metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="experimental"
          fi

          python scripts/prepare_app_build_metadata.py \
            --channel "${CHANNEL}" \
            --source-branch "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Build packaged backend
        run: python scripts/build_backend.py --clean

      - name: Build virtual desktop components
        run: python scripts/build_virtual_desktop_guest.py --clean

      - name: Run optional real virtual desktop provider smoke
        shell: bash
        env:
          OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_TARGET: ${{ secrets.OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_TARGET }}
          OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_PRIVATE_KEY: ${{ secrets.OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_PRIVATE_KEY }}
          OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_KNOWN_HOSTS: ${{ secrets.OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p release
          configured=0
          for value in \
            "${OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_TARGET}" \
            "${OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_PRIVATE_KEY}" \
            "${OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_KNOWN_HOSTS}"; do
            if [[ -n "${value}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "${configured}" -eq 0 ]]; then
            python - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "ok": False,
              "status": "not_configured",
              "mode": "real_virtual_desktop_provider",
              "required_secrets": [
                  "OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_TARGET",
                  "OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_PRIVATE_KEY",
                  "OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_KNOWN_HOSTS",
              ],
          }
          Path("release/virtual-desktop-provider-smoke.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
            echo "Real virtual desktop provider smoke not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${configured}" -ne 3 ]]; then
            echo "Real virtual desktop provider smoke secrets must be configured together." >&2
            exit 1
          fi

          IDENTITY_PATH="${RUNNER_TEMP}/oha-yachiyo-vm-identity"
          KNOWN_HOSTS_PATH="${RUNNER_TEMP}/oha-yachiyo-vm-known-hosts"
          TOKEN_PATH="${RUNNER_TEMP}/oha-yachiyo-vm-provider.token"
          MANIFEST_PATH="${RUNNER_TEMP}/oha-yachiyo-vm-provider.manifest.json"
          INSTALL_REPORT_PATH="${RUNNER_TEMP}/oha-yachiyo-vm-install.json"
          trap 'rm -f "${IDENTITY_PATH}" "${KNOWN_HOSTS_PATH}" "${TOKEN_PATH}" "${MANIFEST_PATH}" "${INSTALL_REPORT_PATH}"' EXIT
          printf '%s\n' "${OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_PRIVATE_KEY}" > "${IDENTITY_PATH}"
          printf '%s\n' "${OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_KNOWN_HOSTS}" > "${KNOWN_HOSTS_PATH}"
          chmod 600 "${IDENTITY_PATH}" "${KNOWN_HOSTS_PATH}"

          python scripts/install_virtual_desktop_guest.py \
            --ssh-target "${OHA_YACHIYO_VIRTUAL_DESKTOP_SSH_TARGET}" \
            --session-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --identity-file "${IDENTITY_PATH}" \
            --local-token-file "${TOKEN_PATH}" \
            --manifest-out "${MANIFEST_PATH}" \
            --ssh-option BatchMode=yes \
            --ssh-option IdentitiesOnly=yes \
            --ssh-option StrictHostKeyChecking=yes \
            --ssh-option "UserKnownHostsFile=${KNOWN_HOSTS_PATH}" \
            --ssh-option ConnectTimeout=15 \
            > "${INSTALL_REPORT_PATH}"
          python scripts/smoke_oha_desktop_agent_release.py \
            --provider-manifest "${MANIFEST_PATH}" \
            --public-release \
            --report-json release/virtual-desktop-provider-smoke.json
          echo "Real virtual desktop provider smoke passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Import macOS signing certificate
        id: macos_signing
        shell: bash
        env:
          MACOS_CODESIGN_CERTIFICATE_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CODESIGN_CERTIFICATE_BASE64}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
            echo "signing_mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "No macOS signing certificate configured; the DMG will be unsigned." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SIGNING_IDENTITY="${MACOS_CODESIGN_IDENTITY:-Oha-Yachiyo Self Signed}"
          if [[ "${SIGNING_IDENTITY}" == "Developer ID Application:"* ]]; then
            DEVELOPER_ID=true
            SIGNING_MODE=developer-id-app-notarized-dmg
            if [[ -z "${APPLE_NOTARY_KEY_BASE64}" || -z "${APPLE_NOTARY_KEY_ID}" ]]; then
              echo "APPLE_NOTARY_KEY_BASE64 and APPLE_NOTARY_KEY_ID are required for Developer ID releases." >&2
              exit 1
            fi
          else
            DEVELOPER_ID=false
            SIGNING_MODE=self-signed-app-unsigned-dmg
          fi
          CERT_PASSWORD="${MACOS_CODESIGN_CERTIFICATE_PASSWORD:-}"
          if [[ -z "${CERT_PASSWORD}" ]]; then
            echo "MACOS_CODESIGN_CERTIFICATE_PASSWORD is required when MACOS_CODESIGN_CERTIFICATE_BASE64 is configured." >&2
            echo "Set the password value from dist/signing/*.github-secrets.env, without the variable name." >&2
            exit 1
          fi
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          KEYCHAIN_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.keychain-db"
          CERT_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.p12"
          CERT_PEM_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.pem"
          CERT_X509_PATH="${RUNNER_TEMP}/oha-yachiyo-signing.crt"

          CLEAN_CERT_BASE64="$(printf '%s' "${MACOS_CODESIGN_CERTIFICATE_BASE64}" | tr -d '[:space:]')"
          if ! printf '%s' "${CLEAN_CERT_BASE64}" | base64 --decode > "${CERT_PATH}" 2>/dev/null; then
            printf '%s' "${CLEAN_CERT_BASE64}" | base64 -D > "${CERT_PATH}"
          fi
          if [[ ! -s "${CERT_PATH}" ]]; then
            echo "Decoded MACOS_CODESIGN_CERTIFICATE_BASE64 is empty." >&2
            exit 1
          fi
          if ! openssl pkcs12 -in "${CERT_PATH}" -info -noout -passin "pass:${CERT_PASSWORD}" >/dev/null 2>&1; then
            echo "Cannot read the macOS signing p12 with MACOS_CODESIGN_CERTIFICATE_PASSWORD." >&2
            echo "Check that MACOS_CODESIGN_CERTIFICATE_BASE64 and MACOS_CODESIGN_CERTIFICATE_PASSWORD come from the same generated dist/signing/*.github-secrets.env file." >&2
            echo "When adding GitHub Secrets, paste only the value after '='; do not include the KEY= prefix." >&2
            exit 1
          fi

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          if ! security import "${CERT_PATH}" \
              -k "${KEYCHAIN_PATH}" \
              -P "${CERT_PASSWORD}" \
              -T /usr/bin/codesign \
              -T /usr/bin/security; then
            echo "macOS Keychain could not import the signing p12." >&2
            echo "Check that the p12 contains a private key supported by the runner Keychain." >&2
            exit 1
          fi
          if [[ "${DEVELOPER_ID}" != "true" ]]; then
            openssl pkcs12 \
              -in "${CERT_PATH}" \
              -clcerts \
              -nokeys \
              -out "${CERT_PEM_PATH}" \
              -passin "pass:${CERT_PASSWORD}"
            openssl x509 -in "${CERT_PEM_PATH}" -out "${CERT_X509_PATH}"
            sudo security add-trusted-cert \
              -d \
              -r trustRoot \
              -p codeSign \
              -k /Library/Keychains/System.keychain \
              "${CERT_X509_PATH}"
          fi
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}" >/dev/null
          IDENTITY_OUTPUT="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}")"
          echo "${IDENTITY_OUTPUT}"
          if ! grep -Eq '^[[:space:]]*[0-9]+\) [A-F0-9]{40} ' <<< "${IDENTITY_OUTPUT}"; then
            echo "No valid macOS code signing identity found after importing the p12." >&2
            exit 1
          fi
          if ! grep -Fq -- "\"${SIGNING_IDENTITY}\"" <<< "${IDENTITY_OUTPUT}"; then
            echo "Configured signing identity was not found after importing the p12: ${SIGNING_IDENTITY}" >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "developer_id=${DEVELOPER_ID}" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${SIGNING_MODE}" >> "$GITHUB_OUTPUT"
          echo "identity=${SIGNING_IDENTITY}" >> "$GITHUB_OUTPUT"
          echo "keychain=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
          echo "Imported macOS signing certificate identity: ${SIGNING_IDENTITY}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Electron DMG
        shell: bash
        env:
          MACOS_SIGNING_ENABLED: ${{ steps.macos_signing.outputs.enabled }}
          MACOS_SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
          MACOS_CODESIGN_IDENTITY: ${{ steps.macos_signing.outputs.identity }}
        run: |
          set -euo pipefail
          if [[ "${MACOS_SIGNING_ENABLED}" == "true" ]]; then
            scripts/build_macos_self_signed_dmg.sh "${MACOS_CODESIGN_IDENTITY}"
          else
            MACOS_SIGNING_MODE=self-signed-app-unsigned-dmg \
              scripts/build_macos_self_signed_dmg.sh -
          fi

      - name: Notarize and staple Developer ID DMG
        if: steps.macos_signing.outputs.developer_id == 'true'
        shell: bash
        env:
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          trap 'rm -f "${KEY_PATH}"' EXIT
          CLEAN_KEY_BASE64="$(printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | tr -d '[:space:]')"
          if ! printf '%s' "${CLEAN_KEY_BASE64}" | base64 --decode > "${KEY_PATH}" 2>/dev/null; then
            printf '%s' "${CLEAN_KEY_BASE64}" | base64 -D > "${KEY_PATH}"
          fi
          if [[ ! -s "${KEY_PATH}" ]]; then
            echo "Decoded APPLE_NOTARY_KEY_BASE64 is empty." >&2
            exit 1
          fi
          chmod 600 "${KEY_PATH}"

          shopt -s nullglob
          dmg_files=(dist/electron/*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one DMG for notarization; found ${#dmg_files[@]}." >&2
            exit 1
          fi
          APPLE_NOTARY_KEY_PATH="${KEY_PATH}" \
            scripts/notarize_macos_dmg.sh "${dmg_files[0]}"

      - name: Inspect final macOS signing evidence
        shell: bash
        env:
          EXPECTED_SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(dist/electron/*.dmg)
          if [[ "${#dmg_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one final DMG for signing inspection; found ${#dmg_files[@]}." >&2
            exit 1
          fi
          python scripts/release_integrity.py \
            "${dmg_files[0]}" \
            --output-json release/macos-signing-inspection.json
          DETECTED_SIGNING_MODE="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("release/macos-signing-inspection.json").read_text())["signing"])')"
          if [[ "${DETECTED_SIGNING_MODE}" != "${EXPECTED_SIGNING_MODE:-unsigned}" ]]; then
            echo "Packaged signing mode ${DETECTED_SIGNING_MODE} does not match expected ${EXPECTED_SIGNING_MODE:-unsigned}." >&2
            exit 1
          fi
          echo "Detected macOS signing mode: ${DETECTED_SIGNING_MODE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify packaged app resources
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d dist/electron ]]; then
            echo "No Electron package output found under dist/electron" >&2
            exit 1
          fi

          package_scan_paths=(dist/backend dist/desktop-provider)
          app_resource_dirs=()
          while IFS= read -r -d '' resources_dir; do
            app_resource_dirs+=("${resources_dir}")
          done < <(find dist/electron -path '*/Oha-Yachiyo.app/Contents/Resources' -type d -print0)

          if [[ "${#app_resource_dirs[@]}" -eq 0 ]]; then
            echo "No packaged app resources found under dist/electron" >&2
            exit 1
          fi

          LOCKED_CUA_VERSION="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("packaging/cua-driver.lock.json").read_text())["version"])')"
          for resources_dir in "${app_resource_dirs[@]}"; do
            cua_parent_dir="${resources_dir}/computer-use"
            cua_sidecar_dir="${cua_parent_dir}/macos"
            cua_helper="${cua_sidecar_dir}/OhaCuaDriver.app"
            cua_helper_contents="${cua_helper}/Contents"
            cua_helper_macos="${cua_helper_contents}/MacOS"
            cua_driver="${cua_helper_macos}/cua-driver"
            cua_license="${cua_sidecar_dir}/LICENSE.md"
            cua_manifest="${cua_sidecar_dir}/manifest.json"
            for packaged_cua_dir in \
              "${cua_parent_dir}" \
              "${cua_sidecar_dir}" \
              "${cua_helper}" \
              "${cua_helper_contents}" \
              "${cua_helper_macos}"; do
              if ! test ! -L "${packaged_cua_dir}"; then
                echo "Packaged Cua Driver resource directory must not be a symlink: ${packaged_cua_dir}" >&2
                exit 1
              fi
              if ! test -d "${packaged_cua_dir}"; then
                echo "Packaged Cua Driver resource directory is missing: ${packaged_cua_dir}" >&2
                exit 1
              fi
            done
            python -c '
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              info = plistlib.load(handle)
          expected = {
              "CFBundleExecutable": "cua-driver",
              "CFBundleIdentifier": "io.github.arisataki.oha-yachiyo.cua-driver",
              "CFBundlePackageType": "APPL",
              "LSBackgroundOnly": True,
          }
          if any(info.get(key) != value for key, value in expected.items()):
              raise SystemExit("Packaged Cua Driver helper is not background-only.")
          ' "${cua_helper_contents}/Info.plist"
            for packaged_cua_file in "${cua_driver}" "${cua_license}" "${cua_manifest}"; do
              if ! test ! -L "${packaged_cua_file}"; then
                echo "Packaged Cua Driver resource must not be a symlink: ${packaged_cua_file}" >&2
                exit 1
              fi
              if ! test -f "${packaged_cua_file}"; then
                echo "Packaged Cua Driver resource is missing: ${packaged_cua_file}" >&2
                exit 1
              fi
            done
            if ! test -x "${cua_driver}"; then
              echo "Packaged Cua Driver is not executable: ${cua_driver}" >&2
              exit 1
            fi

            CUA_VERSION_OUTPUT="$("${cua_driver}" --version)"
            if [[ "${CUA_VERSION_OUTPUT}" != "cua-driver ${LOCKED_CUA_VERSION}" ]]; then
              echo "Packaged Cua Driver version does not match packaging/cua-driver.lock.json." >&2
              exit 1
            fi
            "${cua_driver}" manifest | python -c '
          import json
          import sys

          expected_version = sys.argv[1]
          payload = json.load(sys.stdin)
          if str(payload.get("schema_version") or "") != "1":
              raise SystemExit("Packaged Cua Driver manifest schema is unsupported.")
          if str(payload.get("binary_version") or "") != expected_version:
              raise SystemExit("Packaged Cua Driver manifest version does not match the lock.")
          invocation = payload.get("mcp_invocation")
          if not isinstance(invocation, dict) or invocation.get("args") != ["mcp"]:
              raise SystemExit("Packaged Cua Driver manifest has an invalid MCP invocation.")
          subcommands = payload.get("subcommands")
          mcp = next(
              (item for item in subcommands if isinstance(item, dict) and item.get("name") == "mcp"),
              None,
          ) if isinstance(subcommands, list) else None
          argument_names = {
              item.get("name")
              for item in (mcp or {}).get("args", [])
              if isinstance(item, dict)
          }
          if not {"--embedded", "--host-bundle-id"}.issubset(argument_names):
              raise SystemExit("Packaged Cua Driver manifest lacks the embedded host contract.")
          ' "${LOCKED_CUA_VERSION}"

            CUA_ARCHITECTURES="$(lipo -archs "${cua_driver}")"
            python -c '
          import sys

          architectures = set(sys.argv[1].split())
          required = {"arm64", "x86_64"}
          if not required.issubset(architectures):
              raise SystemExit(
                  "Packaged Cua Driver is not universal arm64+x86_64: "
                  + " ".join(sorted(architectures))
              )
          ' "${CUA_ARCHITECTURES}"
          done

          for resources_dir in "${app_resource_dirs[@]}"; do
            app_path="${resources_dir%/Contents/Resources}"
            cua_helper="${resources_dir}/computer-use/macos/OhaCuaDriver.app"
            cua_driver="${cua_helper}/Contents/MacOS/cua-driver"
            python -c '
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as handle:
              info = plistlib.load(handle)
          expected = {
              "CFBundleExecutable": "cua-driver",
              "CFBundleIdentifier": "io.github.arisataki.oha-yachiyo.cua-driver",
              "CFBundlePackageType": "APPL",
              "LSBackgroundOnly": True,
          }
          if any(info.get(key) != value for key, value in expected.items()):
              raise SystemExit("Packaged Cua Driver helper is not background-only.")
          ' "${cua_helper}/Contents/Info.plist"
            echo "Verifying nested Cua Driver helper signature: ${cua_helper}"
            codesign --verify --strict --verbose=2 "${cua_helper}"
            echo "Verifying nested Cua Driver code signature: ${cua_driver}"
            codesign --verify --strict --verbose=2 "${cua_driver}"
            codesign -d --entitlements - --xml "${cua_driver}" 2>/dev/null | python -c '
          import plistlib
          import sys

          expected = {
              "com.apple.security.automation.apple-events": True,
              "com.apple.security.device.screen-capture": True,
          }
          actual = plistlib.loads(sys.stdin.buffer.read())
          if actual != expected:
              raise SystemExit(
                  "Packaged Cua Driver entitlements must contain exactly "
                  "Apple Events and Screen Capture."
              )
          '
            echo "Verifying final packaged app code signature: ${app_path}"
            codesign --verify --deep --strict --verbose=2 "${app_path}"
            codesign -dv "${app_path}" 2>&1 | sed 's/^/codesign: /'
          done

          package_scan_paths+=("${app_resource_dirs[@]}")
          python scripts/verify_release_artifacts.py --allow-binary --check-packaged-app "${package_scan_paths[@]}"

      - name: Prepare release metadata
        id: meta
        shell: bash
        env:
          MACOS_SIGNING_MODE: ${{ steps.macos_signing.outputs.signing_mode }}
        run: |
          set -euo pipefail
          EXPECTED_SIGNING_MODE="${MACOS_SIGNING_MODE:-unsigned}"
          SIGNING_MODE="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("release/macos-signing-inspection.json").read_text())["signing"])')"
          SIGNATURE_KIND="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("release/macos-signing-inspection.json").read_text())["signature_kind"])')"
          if [[ "${SIGNING_MODE}" != "${EXPECTED_SIGNING_MODE}" ]]; then
            echo "Final signing evidence does not match the configured packaging mode." >&2
            exit 1
          fi
          VERSION="$(python scripts/app_version.py current)"
          RELEASE_VERSION="${VERSION}"
          ARCHITECTURE="$(node -p 'process.arch')"
          if [[ "${ARCHITECTURE}" != "arm64" && "${ARCHITECTURE}" != "x64" ]]; then
            echo "Unsupported macOS release architecture: ${ARCHITECTURE}" >&2
            exit 1
          fi
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BUILD_LABEL="build.${BUILD_NUMBER}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${SIGNING_MODE}" == "developer-id-app-notarized-dmg" ]]; then
            SIGNING_NOTE="本构建使用 Apple Developer ID Application 签名、Hardened Runtime、secure timestamp 和 Apple notarization，并已将公证票据 staple 到 DMG。"
          elif [[ "${SIGNING_MODE}" == "self-signed-app-unsigned-dmg" ]]; then
            SIGNING_NOTE="当前免费分发回退链路只自签名 .app，未使用 Apple Developer ID 签名或 notarization，DMG 保持未签名。首次启动仍会显示未知开发者 / Gatekeeper 提示；请在 Finder 中按住 Control 点击应用并选择“打开”，或在系统设置的“隐私与安全性”中允许打开。"
          elif [[ "${SIGNATURE_KIND}" == "adhoc" ]]; then
            SIGNING_NOTE="本构建的 .app 只有 macOS ad-hoc 签名，DMG 未签名；未使用 Apple Developer ID 或 notarization。首次启动会显示未知开发者 / Gatekeeper 提示；请在 Finder 中按住 Control 点击应用并选择“打开”，或在系统设置的“隐私与安全性”中允许打开。"
          else
            SIGNING_NOTE="本构建未配置 macOS 签名证书，DMG 与应用均为 unsigned；首次启动会显示未知开发者 / Gatekeeper 提示。"
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            CHANNEL="${{ inputs.channel }}"
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            CHANNEL="stable"
          else
            CHANNEL="experimental"
          fi

          if [[ "${CHANNEL}" == "stable" ]]; then
            CHANNEL_LABEL="正式版"
            PRERELEASE="false"
            LATEST_BRANCH="main"
          elif [[ "${CHANNEL}" == "alpha" ]]; then
            CHANNEL_LABEL="Alpha 版"
            PRERELEASE="true"
            LATEST_BRANCH="alpha"
          else
            CHANNEL_LABEL="实验版"
            PRERELEASE="true"
            LATEST_BRANCH="oha-develop"
          fi

          TAG="${CHANNEL}-v${RELEASE_VERSION}-${BUILD_LABEL}-${SHORT_SHA}"
          TITLE="Oha-Yachiyo ${CHANNEL_LABEL} v${RELEASE_VERSION} #${BUILD_NUMBER} (${SHORT_SHA})"
          LATEST_TAG="${LATEST_BRANCH}-latest"
          LATEST_TITLE="Oha-Yachiyo ${CHANNEL_LABEL} latest"
          VERSIONED_DMG="Oha-Yachiyo-${CHANNEL}-v${RELEASE_VERSION}-${BUILD_LABEL}-${SHORT_SHA}-${ARCHITECTURE}.dmg"
          LATEST_DMG="Oha-Yachiyo-${LATEST_BRANCH}-latest.dmg"
          VERSIONED_ZIP="Oha-Yachiyo-${CHANNEL}-v${RELEASE_VERSION}-${BUILD_LABEL}-${SHORT_SHA}-${ARCHITECTURE}.zip"
          LATEST_ZIP="Oha-Yachiyo-${LATEST_BRANCH}-latest-${ARCHITECTURE}.zip"
          LATEST_JSON="Oha-Yachiyo-${LATEST_BRANCH}-latest.json"

          mkdir -p release
          shopt -s nullglob
          dmg_files=(dist/electron/*.dmg)
          if [[ "${#dmg_files[@]}" -eq 0 ]]; then
            echo "No DMG artifact found under dist/electron" >&2
            exit 1
          fi
          if [[ "${#dmg_files[@]}" -gt 1 ]]; then
            echo "Multiple DMG artifacts found; refusing to choose implicitly." >&2
            printf '  %s\n' "${dmg_files[@]}" >&2
            exit 1
          fi
          EXPECTED_SOURCE_DMG="Oha-Yachiyo-${RELEASE_VERSION}-${ARCHITECTURE}.dmg"
          if [[ "$(basename "${dmg_files[0]}")" != "${EXPECTED_SOURCE_DMG}" ]]; then
            echo "Electron DMG name does not match version/architecture: expected ${EXPECTED_SOURCE_DMG}." >&2
            exit 1
          fi
          app_paths=()
          while IFS= read -r -d '' app_path; do
            app_paths+=("${app_path}")
          done < <(find dist/electron -mindepth 2 -maxdepth 2 -name 'Oha-Yachiyo.app' -type d -print0)
          if [[ "${#app_paths[@]}" -ne 1 ]]; then
            echo "Expected exactly one unpacked Oha-Yachiyo.app for ZIP packaging; found ${#app_paths[@]}." >&2
            exit 1
          fi
          APP_EXECUTABLE="${app_paths[0]}/Contents/MacOS/Oha-Yachiyo"
          if [[ ! -x "${APP_EXECUTABLE}" ]]; then
            echo "Packaged app executable is missing or not executable: ${APP_EXECUTABLE}" >&2
            exit 1
          fi
          APP_ARCHITECTURES="$(lipo -archs "${APP_EXECUTABLE}")"
          NORMALIZED_APP_ARCHITECTURE="$(python -c 'import sys; from scripts.release_integrity import normalize_macos_lipo_architecture; print(normalize_macos_lipo_architecture(sys.argv[1]))' "${APP_ARCHITECTURES}")"
          if [[ "${NORMALIZED_APP_ARCHITECTURE}" != "${ARCHITECTURE}" ]]; then
            echo "Packaged app architecture ${APP_ARCHITECTURES} (${NORMALIZED_APP_ARCHITECTURE}) does not match release architecture ${ARCHITECTURE}." >&2
            exit 1
          fi

          python scripts/build_release_candidate_artifacts.py \
            --stage-existing \
            --dmg "${dmg_files[0]}" \
            --app "${app_paths[0]}" \
            --build-metadata apps/frontend/public/oha-yachiyo-build.json \
            --signing-inspection-json release/macos-signing-inspection.json \
            --architecture "${ARCHITECTURE}" \
            --signing-mode "${SIGNING_MODE}"

          cp "${dmg_files[0]}" "release/${VERSIONED_DMG}"
          cp "release/${LATEST_ZIP}" "release/${VERSIONED_ZIP}"
          VERSIONED_SHA256="$(shasum -a 256 "release/${VERSIONED_DMG}" | awk '{print $1}')"
          VERSIONED_ZIP_SHA256="$(shasum -a 256 "release/${VERSIONED_ZIP}" | awk '{print $1}')"
          printf '%s  %s\n' "${VERSIONED_SHA256}" "${VERSIONED_DMG}" > "release/${VERSIONED_DMG}.sha256"
          printf '%s  %s\n' "${VERSIONED_ZIP_SHA256}" "${VERSIONED_ZIP}" > "release/${VERSIONED_ZIP}.sha256"

          cat > release/notes.md <<EOF
          Oha-Yachiyo ${CHANNEL_LABEL}

          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Channel: ${CHANNEL}
          - Product version: ${VERSION}
          - Build: #${BUILD_NUMBER}
          - Architecture: ${ARCHITECTURE}
          - Signing: ${SIGNING_MODE} (${SIGNATURE_KIND})
          - Packages: macOS DMG and app ZIP
          - Latest channel download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_DMG}
          - Latest channel app ZIP: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_ZIP}

          $(cat release/changelog.md)

          ${SIGNING_NOTE}

          GPT-SoVITS 语音资源包不随应用 DMG 发布；请在独立的“Yachiyo GPT-SoVITS Voice Assets”资源 release 中下载。

          首次启动后，主动桌面观察需要在 macOS 系统设置中允许 Oha-Yachiyo 使用屏幕录制权限。
          EOF

          cat > release/latest-notes.md <<EOF
          Oha-Yachiyo ${CHANNEL_LABEL} latest

          This rolling release always points to the latest ${LATEST_BRANCH} DMG.

          - Branch: ${GITHUB_REF_NAME}
          - Commit: ${GITHUB_SHA}
          - Channel: ${CHANNEL}
          - Product version: ${VERSION}
          - Build: #${BUILD_NUMBER}
          - Architecture: ${ARCHITECTURE}
          - Signing: ${SIGNING_MODE} (${SIGNATURE_KIND})
          - DMG: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_DMG}
          - App ZIP: https://github.com/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_ZIP}

          $(cat release/changelog.md)

          ${SIGNING_NOTE}
          EOF

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "latest_title=${LATEST_TITLE}" >> "$GITHUB_OUTPUT"
          echo "versioned_dmg=${VERSIONED_DMG}" >> "$GITHUB_OUTPUT"
          echo "latest_dmg=${LATEST_DMG}" >> "$GITHUB_OUTPUT"
          echo "versioned_zip=${VERSIONED_ZIP}" >> "$GITHUB_OUTPUT"
          echo "latest_zip=${LATEST_ZIP}" >> "$GITHUB_OUTPUT"
          echo "latest_json=${LATEST_JSON}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged release artifacts
        run: python scripts/verify_release_artifacts.py --allow-binary release

      - name: Verify release candidate artifacts
        id: release_smoke
        shell: bash
        env:
          OHA_YACHIYO_SMOKE_BASE_URL: ${{ secrets.OHA_YACHIYO_SMOKE_BASE_URL }}
          OHA_YACHIYO_SMOKE_MODEL: ${{ secrets.OHA_YACHIYO_SMOKE_MODEL }}
          OHA_YACHIYO_SMOKE_API_KEY: ${{ secrets.OHA_YACHIYO_SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          provider_smoke_args=()
          provider_smoke_status_args=()
          if [[ -z "${OHA_YACHIYO_SMOKE_BASE_URL}" || -z "${OHA_YACHIYO_SMOKE_MODEL}" || -z "${OHA_YACHIYO_SMOKE_API_KEY}" ]]; then
            echo "Skipping opt-in real provider smoke; OHA_YACHIYO_SMOKE_* secrets are not fully configured."
            provider_smoke_status_args+=(--mark-provider-smoke-not-applicable-if-missing)
          else
            provider_smoke_args+=(--run-provider-smoke)
          fi
          python scripts/verify_release_candidate.py --write-manual-checks-template release/manual-rc-checks.template.json
          python scripts/verify_release_candidate.py --require-artifacts --check-dmg-mount --check-gatekeeper-readiness --run-packaged-backend-bridge-smoke --run-dmg-app-smoke --run-dmg-chat-native-file-smoke --run-electron-native-bridge-smoke "${provider_smoke_args[@]}" "${provider_smoke_status_args[@]}" --report-json release/rc-verification.json
          release_smoke_status=0
          python scripts/summarize_release_smoke.py \
            release/rc-verification.json \
            release/public-release-gate/oha-desktop-agent-release-smoke.json \
            release/public-release-gate/public-demo.json \
            release/electron-ui-smoke.json \
            release/virtual-desktop-provider-smoke.json \
            --diagnostics-zip release/public-release-gate/diagnostics.zip \
            --output-json release/release-smoke.json \
            --output-markdown release/release-smoke.md || release_smoke_status=$?
          if [[ ! -s release/release-smoke.json ]]; then
            echo "Release smoke summary did not produce release/release-smoke.json."
            release_smoke_status=1
          fi
          if [[ "${release_smoke_status}" -ne 0 ]]; then
            echo "Release smoke evidence is incomplete; see release/release-smoke.json."
          fi
          echo "release_smoke_status=${release_smoke_status}" >> "$GITHUB_OUTPUT"
          python scripts/verify_release_candidate.py --manual-checks-json release/rc-verification.json --manual-checks-json release/electron-ui-smoke.json --write-manual-checks-draft release/manual-rc-checks.draft.json "${provider_smoke_status_args[@]}"
          python scripts/verify_release_candidate.py --manual-checks-json release/manual-rc-checks.draft.json --write-manual-checks-markdown release/manual-rc-checks.md "${provider_smoke_status_args[@]}"

      - name: Upload DMG artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oha-yachiyo-${{ steps.meta.outputs.tag }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.sha256
            release/*.json
            release/*.md
            release/public-release-gate/*.json
            release/public-release-gate/*.md
            release/public-release-gate/*.zip

      - name: Enforce release smoke readiness
        if: always() && (github.event_name == 'push' || inputs.publish_release == true)
        shell: bash
        env:
          RELEASE_SMOKE_STATUS: ${{ steps.release_smoke.outputs.release_smoke_status }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_SMOKE_STATUS}" =~ ^[0-9]+$ ]]; then
            echo "Release smoke readiness status is missing or invalid; inspect the uploaded release evidence." >&2
            exit 1
          fi
          if [[ "${RELEASE_SMOKE_STATUS}" -ne 0 ]]; then
            echo "Release smoke evidence is incomplete; publication is blocked." >&2
            exit 1
          fi

      - name: Create or update versioned GitHub release
        if: success() && (github.event_name == 'push' || inputs.publish_release == true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          VERSIONED_DMG="${{ steps.meta.outputs.versioned_dmg }}"
          LATEST_DMG="${{ steps.meta.outputs.latest_dmg }}"
          VERSIONED_ZIP="${{ steps.meta.outputs.versioned_zip }}"
          LATEST_ZIP="${{ steps.meta.outputs.latest_zip }}"
          LATEST_JSON="${{ steps.meta.outputs.latest_json }}"
          extra_flags=()
          release_assets=(
            "release/${VERSIONED_DMG}"
            "release/${VERSIONED_DMG}.sha256"
            "release/${VERSIONED_ZIP}"
            "release/${VERSIONED_ZIP}.sha256"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            extra_flags+=(--prerelease --latest=false)
          else
            extra_flags+=(--latest=true)
            release_assets+=(
              "release/${LATEST_DMG}"
              "release/${LATEST_DMG}.sha256"
              "release/${LATEST_ZIP}"
              "release/${LATEST_ZIP}.sha256"
              "release/${LATEST_JSON}"
            )
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "${release_assets[@]}" \
              --clobber
            gh release edit "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release/notes.md \
              "${extra_flags[@]}"
          else
            gh release create "${TAG}" \
              "${release_assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file release/notes.md \
              "${extra_flags[@]}"
          fi

      - name: Create or update latest channel release
        if: success() && (github.event_name == 'push' || inputs.publish_release == true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="${{ steps.meta.outputs.latest_tag }}"
          LATEST_TITLE="${{ steps.meta.outputs.latest_title }}"
          PRERELEASE="${{ steps.meta.outputs.prerelease }}"
          LATEST_DMG="${{ steps.meta.outputs.latest_dmg }}"
          LATEST_ZIP="${{ steps.meta.outputs.latest_zip }}"
          LATEST_JSON="${{ steps.meta.outputs.latest_json }}"
          latest_flags=(--latest=false)
          latest_assets=(
            "release/${LATEST_DMG}"
            "release/${LATEST_DMG}.sha256"
            "release/${LATEST_ZIP}"
            "release/${LATEST_ZIP}.sha256"
            "release/${LATEST_JSON}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            latest_flags+=(--prerelease)
          fi

          if gh release view "${LATEST_TAG}" >/dev/null 2>&1; then
            gh release upload "${LATEST_TAG}" \
              "${latest_assets[@]}" \
              --clobber
            gh release edit "${LATEST_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${LATEST_TITLE}" \
              --notes-file release/latest-notes.md \
              "${latest_flags[@]}"
          else
            gh release create "${LATEST_TAG}" \
              "${latest_assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${LATEST_TITLE}" \
              --notes-file release/latest-notes.md \
              "${latest_flags[@]}"
          fi
