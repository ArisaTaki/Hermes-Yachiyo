appId: io.github.arisataki.oha-yachiyo
productName: Oha-Yachiyo
copyright: Copyright © 2026 Oha-Yachiyo

directories:
  output: ../../dist/electron

# Local node-pty rebuilds embed workspace paths in native binaries; package clean prebuilds instead.
npmRebuild: false

files:
  - dist/**
  - dist-electron/**
  - package.json
  - node_modules/node-pty/package.json
  - node_modules/node-pty/LICENSE
  - node_modules/node-pty/lib/**
  - node_modules/node-pty/prebuilds/darwin-arm64/**
  - node_modules/node-pty/prebuilds/darwin-x64/**
  - node_modules/node-addon-api/**
  - '!**/.vite/**'
  - '!node_modules/node-pty/build/**'
  - '!node_modules/node-pty/prebuilds/win32*/**'
  - '!node_modules/node-pty/deps/**'
  - '!node_modules/node-pty/src/**'
  - '!node_modules/node-pty/third_party/**'
  - '!node_modules/node-pty/scripts/**'
  - '!node_modules/node-pty/typings/**'
  - '!node_modules/node-pty/**/*.map'
  - '!node_modules/node-pty/**/*.test.js'
  - '!node_modules/@lobehub/icons/**'

extraResources:
  - from: ../../dist/backend/oha-yachiyo-backend
    to: backend/oha-yachiyo-backend
  - from: ../../dist/desktop-provider/oha-yachiyo-desktop-provider
    to: desktop-provider/oha-yachiyo-desktop-provider
  - from: ../../assets
    to: assets
    filter:
      - icon.png

asarUnpack:
  - node_modules/node-pty/prebuilds/darwin-arm64/**
  - node_modules/node-pty/prebuilds/darwin-x64/**

mac:
  icon: ../../assets/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: ../../packaging/entitlements.mac.plist
  entitlementsInherit: ../../packaging/entitlements.mac.plist
  target:
    - target: dmg
  extendInfo:
    NSAppleEventsUsageDescription: Oha-Yachiyo 需要读取当前窗口标题和应用名称，用于主动关怀和上下文提示。
    NSDocumentsFolderUsageDescription: Oha-Yachiyo 需要访问用户选择的项目文件和资源目录。
    NSDownloadsFolderUsageDescription: Oha-Yachiyo 需要访问用户选择导入的下载资源。
    NSMicrophoneUsageDescription: Oha-Yachiyo 的语音相关功能可能需要访问麦克风输入。

dmg:
  artifactName: Oha-Yachiyo-${version}-${arch}.${ext}

publish: null
